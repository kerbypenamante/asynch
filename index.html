<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async JavaScript CRUD</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f4f6f8;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            margin-right: 5px;
        }

        #submitBtn {
            background: #007bff;
        }

        #cancelBtn {
            background: #6c757d;
        }

        .edit-btn {
            background: #ffc107;
            color: black;
        }

        .delete-btn {
            background: #dc3545;
        }

        button:hover {
            opacity: 0.85;
        }

        #status {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            background: #fff3cd;
            color: #856404;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #007bff;
            color: white;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .actions {
            white-space: nowrap;
        }

        .hidden {
            display: none;
        }

        #loadingText {
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Async JavaScript CRUD Application</h1>

    <!-- STATUS MESSAGE -->
    <div id="status"></div>

    <!-- FORM -->
    <div class="form-section">

        <h2 id="formTitle">Add User</h2>

        <form id="userForm">

            <div class="form-group">
                <label for="firstName">First Name</label>
                <input
                    type="text"
                    id="firstName"
                    placeholder="Enter first name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input
                    type="text"
                    id="lastName"
                    placeholder="Enter last name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    required
                >
            </div>

            <button type="submit" id="submitBtn">
                Add User
            </button>

            <button
                type="button"
                id="cancelBtn"
                class="hidden"
                onclick="cancelEdit()"
            >
                Cancel
            </button>

        </form>

    </div>

    <!-- USERS -->
    <h2>Users</h2>

    <p id="loadingText" class="hidden">
        Loading records...
    </p>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="userTable">
        </tbody>

    </table>

</div>


<script>
    // API used for asynchronous HTTP CRUD demonstration
    const API_URL = "https://jsonplaceholder.typicode.com/posts";

    const userForm = document.getElementById("userForm");
    const firstNameInput = document.getElementById("firstName");
    const lastNameInput = document.getElementById("lastName");
    const emailInput = document.getElementById("email");
    const userTable = document.getElementById("userTable");
    const statusMessage = document.getElementById("status");
    const loadingText = document.getElementById("loadingText");
    const formTitle = document.getElementById("formTitle");
    const submitBtn = document.getElementById("submitBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    let editingId = null;
    let users = [];

    function showStatus(message, type) {
        statusMessage.textContent = message;
        statusMessage.className = type;
        statusMessage.style.display = "block";
    }

    function setLoading(isLoading) {
        loadingText.classList.toggle("hidden", !isLoading);
    }

    // READ - GET
    async function getUsers() {
        try {
            setLoading(true);
            showStatus("Loading records from API...", "loading");

            const response = await fetch(`${API_URL}?_limit=10`);

            if (!response.ok) {
                throw new Error(`HTTP Error: ${response.status}`);
            }

            const data = await response.json();

            // Convert JSONPlaceholder posts to the fields used by the form.
            users = data.map(post => ({
                id: post.id,
                firstName: post.title.split(" ")[0] || "User",
                lastName: "Record",
                email: `${post.id}@gmail.com`,
                title: post.title,
                body: post.body
            }));

            displayUsers();

            showStatus("Records loaded successfully.", "success");
        } catch (error) {
            console.error(error);
            showStatus("Failed to load records: " + error.message, "error");
        } finally {
            setLoading(false);
        }
    }

    function displayUsers() {
        userTable.innerHTML = "";

        users.forEach(user => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${user.id}</td>
                <td>${escapeHTML(user.firstName)} ${escapeHTML(user.lastName)}</td>
                <td>${escapeHTML(user.email)}</td>
                <td class="actions">
                    <button class="edit-btn" onclick="editUser(${user.id})">
                        Edit
                    </button>
                    <button class="delete-btn" onclick="deleteUser(${user.id})">
                        Delete
                    </button>
                </td>
            `;

            userTable.appendChild(row);
        });
    }

    // CREATE - POST
    async function addUser(userData) {
    try {
        showStatus("Adding record...", "loading");

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title: `${userData.firstName} ${userData.lastName}`,
                body: userData.email,
                userId: 1
            })
        });

        if (!response.ok) {
            throw new Error(`HTTP Error: ${response.status}`);
        }

        const created = await response.json();
        
        // Generate sequential ID based on existing users
        const newId = users.length > 0 ? Math.max(...users.map(u => u.id)) + 1 : 11;

        const newUser = {
            id: newId,
            firstName: userData.firstName,
            lastName: userData.lastName,
            email: userData.email
        };

        users.unshift(newUser);
        displayUsers();
        userForm.reset();

        showStatus(
            `Record added successfully! New ID: ${newId}.`,
            "success"
        );
    } catch (error) {
        console.error(error);
        showStatus("Failed to add record: " + error.message, "error");
    }
}

    // UPDATE - PUT
        // UPDATE - PUT
    async function updateUser(id, userData) {
        try {
            showStatus("Updating record...", "loading");

            const response = await fetch(`${API_URL}/${id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    id: id,
                    title: `${userData.firstName} ${userData.lastName}`,
                    body: userData.email,
                    userId: 1
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP Error: ${response.status}`);
            }

            const updated = await response.json();

            users = users.map(user =>
                user.id === id ? { ...user, firstName: userData.firstName, lastName: userData.lastName, email: userData.email } : user
            );

            displayUsers();
            cancelEdit();

            showStatus(
                `Record ${updated.id} updated successfully!`,
                "success"
            );
        } catch (error) {
            console.error(error);
            showStatus("Failed to update record: " + error.message, "error");
        }
    }

    // DELETE - DELETE
    async function deleteUser(id) {
        if (!confirm("Are you sure you want to delete this record?")) {
            return;
        }

        try {
            showStatus("Deleting record...", "loading");

            const response = await fetch(`${API_URL}/${id}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                throw new Error(`HTTP Error: ${response.status}`);
            }

            // Only update the visible list after the API request succeeds.
            users = users.filter(user => user.id !== id);
            displayUsers();

            showStatus(
                `Record ${id} deleted successfully!`,
                "success"
            );
        } catch (error) {
            console.error(error);
            showStatus("Failed to delete record: " + error.message, "error");
        }
    }

    function editUser(id) {
        const user = users.find(user => user.id === id);

        if (!user) {
            showStatus("Record not found.", "error");
            return;
        }

        editingId = id;

        firstNameInput.value = user.firstName;
        lastNameInput.value = user.lastName;
        emailInput.value = user.email;

        formTitle.textContent = "Update User";
        submitBtn.textContent = "Update User";
        cancelBtn.classList.remove("hidden");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }

    function cancelEdit() {
        editingId = null;
        userForm.reset();

        formTitle.textContent = "Add User";
        submitBtn.textContent = "Add User";
        cancelBtn.classList.add("hidden");
    }

    userForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const userData = {
            firstName: firstNameInput.value.trim(),
            lastName: lastNameInput.value.trim(),
            email: emailInput.value.trim()
        };

        if (!userData.firstName || !userData.lastName || !userData.email) {
            showStatus("Please fill in all fields.", "error");
            return;
        }

        if (editingId !== null) {
            await updateUser(editingId, userData);
        } else {
            await addUser(userData);
        }
    });

    function escapeHTML(value) {
        const div = document.createElement("div");
        div.textContent = value;
        return div.innerHTML;
    }

    // Initial GET request
    getUsers();
</script>

</body>
</html>
